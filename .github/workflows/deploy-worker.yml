name: Deploy push-worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'push-worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'push-worker'
          secrets: |
            VAPID_PRIVATE_KEY_JWK
            FIREBASE_PROJECT_ID
        env:
          VAPID_PRIVATE_KEY_JWK: ${{ secrets.VAPID_PRIVATE_KEY_JWK }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
